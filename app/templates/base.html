<!doctype html>
<html lang="en" class="bg-slate-950 text-slate-100">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cost Dashboard{% endblock %}</title>
  <!-- Tailwind is compiled into /static/tailwind.css at image-build time (see Dockerfile).
       No external CDN at runtime, so LAN DNS filters can't break the styling. -->
  <link rel="stylesheet" href="/static/tailwind.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="min-h-screen">
  <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3">
        <span class="inline-block w-2 h-8 bg-brand-500 rounded"></span>
        <span class="text-xl font-semibold tracking-tight">Cost Dashboard</span>
        <span class="text-xs text-slate-400">AI model pricing tracker</span>
      </a>
      <div class="flex items-center gap-3">
        {% block header_actions %}{% endblock %}
      </div>
    </div>
  </header>
  <main class="max-w-7xl mx-auto px-6 py-8">
    {% block content %}{% endblock %}
  </main>
  <footer class="max-w-7xl mx-auto px-6 py-10 text-center text-xs text-slate-500">
    Data sources: manual seed file + Firecrawl scrapes + Claude-driven discovery.
    Prices update on refresh. Older snapshots preserved per model.
  </footer>
  <script src="/static/app.js"></script>
</body>
</html>
